name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          problem-matcher: true

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Analyze
        run: fvm flutter analyze

      - name: Test
        run: fvm flutter test
