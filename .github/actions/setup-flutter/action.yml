name: Setup Flutter
description: Install FVM, the project Flutter SDK, and Dart dependencies.

runs:
  using: composite
  steps:
    - name: Cache FVM Flutter SDKs
      uses: actions/cache@v5
      with:
        path: ~/.fvm
        key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc') }}
        restore-keys: |
          fvm-${{ runner.os }}-

    - name: Install FVM
      shell: bash
      run: |
        dart pub global activate fvm
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

    - name: Install Flutter SDK
      shell: bash
      run: fvm install

    # The committed lockfile uses the CN mirror for local development.
    # Normalize only this CI workspace so GitHub resolves from pub.dev.
    - name: Align lockfile with official Pub source
      shell: bash
      run: sed -i 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock

    - name: Get dependencies
      shell: bash
      run: fvm flutter pub get --enforce-lockfile
